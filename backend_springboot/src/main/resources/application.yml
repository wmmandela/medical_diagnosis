server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-medical-expert-system
  datasource:
    url: jdbc:h2:mem:expertdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

expert-system:
  python-url: http://localhost:8000
